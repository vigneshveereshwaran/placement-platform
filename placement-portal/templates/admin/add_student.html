<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#081b29;
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#081b29;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#00d9b8;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#00b89c;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Add Student</h1>

        <form>

            <label>Student Name</label>
            <input type="text">

            <label>Roll Number</label>
            <input type="text">

            <label>Department</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Phone Number</label>
            <input type="tel">

            <button type="submit">Add Student</button>

        </form>

    </div>

</body>
</html>
